[project]
name = "trial-matcher"
version = "0.1.0"
description = "Match plain-English patient profiles to ClinicalTrials.gov trials. Decision support, not medical advice."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trial_matcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
